<html lang="es">
<head>

<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#07070c;color:#f4f1ea;font-family:'DM Mono',ui-monospace,monospace}
a{color:#f4f1ea}
a:focus-visible,button:focus-visible{outline:2px solid #e2c27a;outline-offset:4px}
:root{--gold:#e2c27a}

.page{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;
  background:#07070c url(assets/videos-bg-desktop.jpg) center/cover no-repeat}
.shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(7,7,12,0) 0%,rgba(7,7,12,0) 40%,rgba(7,7,12,.55) 62%,rgba(7,7,12,.78) 100%),
             linear-gradient(180deg,rgba(7,7,12,.6) 0%,rgba(7,7,12,0) 20%)}
.orbit{position:absolute;left:5vw;top:13vh;width:min(53vw,760px);aspect-ratio:1;opacity:.35;pointer-events:none;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Header (igual a la home) */
.header{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:40px 64px}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none}
.nav{display:flex;align-items:center;gap:44px}
.nav-link{position:relative;font-size:14px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;opacity:.86;transition:opacity .2s}
.nav-link:hover{opacity:1}
.nav-link::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.nav-link:hover::after,.nav-link.active::after{transform:scaleX(1)}
.nav-link.active{opacity:1;color:var(--gold)}
.icons{display:flex;gap:8px;margin-left:4px}
.icon-link{display:flex;align-items:center;justify-content:center;width:44px;height:44px;opacity:.86;transition:opacity .2s,transform .2s}
.icon-link:hover{opacity:1;transform:translateY(-1px)}
.menu-btn{display:none;width:48px;height:48px;border:0;background:transparent;color:#f4f1ea;cursor:pointer;padding:0;align-items:center;justify-content:center}
.menu-btn .i-close{display:none}
.menu-open .menu-btn .i-open{display:none}
.menu-open .menu-btn .i-close{display:block}

/* Título */
.heading{position:absolute;left:64px;bottom:56px;z-index:1;display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.heading h1{margin:0;font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(72px,8.4vw,120px);line-height:.85;text-transform:uppercase}

/* Videos */
.list{position:relative;z-index:1;margin-left:auto;width:min(500px,40vw);padding:140px 64px 80px 0;display:flex;flex-direction:column;gap:36px;box-sizing:content-box}
.item{width:100%}
.frame{position:relative;aspect-ratio:16/9;border:1px solid rgba(226,194,122,.55);box-shadow:0 30px 60px rgba(0,0,0,.55);background:#000;overflow:hidden}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.meta{display:flex;align-items:baseline;gap:16px;margin-top:16px}
.num{font-size:12px;letter-spacing:.2em;color:var(--gold)}
.name{font-family:'Syne',sans-serif;font-weight:600;font-size:24px}
.line{flex:1;height:1px;background:rgba(226,194,122,.4)}
.yt{font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;opacity:.75}
.yt:hover{opacity:1;color:var(--gold)}

/* Mobile */
@media (max-width: 860px){
  .page{background:#07070c url(assets/videos-bg-mobile.jpg) top center/100% auto no-repeat}
  .shade{background:linear-gradient(180deg,rgba(7,7,12,.55) 0%,rgba(7,7,12,0) 12%,rgba(7,7,12,0) 34%,rgba(7,7,12,.6) 50%,rgba(7,7,12,.75) 100%)}
  .orbit{display:none}
  .header{padding:20px 20px 0 24px}
  .logo{font-size:20px}
  .menu-btn{display:flex}
  .nav{position:fixed;inset:0;z-index:-1;flex-direction:column;align-items:flex-start;justify-content:center;gap:28px;padding:0 32px;background:rgba(7,7,12,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .28s ease,visibility .28s}
  .menu-open .nav{opacity:1;visibility:visible}
  .nav-link{font-family:'Syne',sans-serif;font-weight:800;font-size:40px;letter-spacing:.02em;opacity:1}
  .nav-link::after{display:none}
  .icons{margin:12px 0 0 -10px}
  .heading{position:relative;left:auto;bottom:auto;padding:min(143vw,560px) 24px 0}
  .eyebrow{font-size:11px}
  .heading h1{font-size:72px}
  .list{width:auto;margin:0;padding:32px 24px 64px;box-sizing:border-box}
  .item{width:100%}
  .name{font-size:20px}
  .yt{font-size:11px}
}
@media (prefers-reduced-motion: reduce){.orbit{animation:none}}

/* Header compacto */
.header{padding:30px 64px}
.logo{font-size:15px;letter-spacing:.06em}
.nav{gap:32px}
.nav-link{font-size:12px;letter-spacing:.16em}
.icon-link{width:38px;height:38px}
.icons svg{width:19px;height:19px}
@media (max-width: 860px){
  .header{padding:20px 20px 0 24px}
  .logo{font-size:14px}
  .nav-link{font-size:22px;letter-spacing:.04em}
  .nav{gap:18px}
  .icons{margin-top:8px}
  .icon-link{width:48px;height:48px}
  .icons svg{width:24px;height:24px}
}

/* Títulos que se ajustan al ancho */
[data-fit] .fl{display:block;width:max-content;white-space:nowrap}

/* Evita que el contenido se corra para el costado en celulares */
html{overflow-x:hidden}
.page{overflow:clip}
</style>
</head>

<script>
(function(){
  var header = document.getElementById('header'), mb = document.getElementById('menuBtn');
  function toggleMenu(open){
    header.classList.toggle('menu-open', open);
    mb.setAttribute('aria-expanded', open);
    mb.setAttribute('aria-label', open ? 'Cerrar menú' : 'Abrir menú');
  }
  mb.addEventListener('click', function(){ toggleMenu(!header.classList.contains('menu-open')); });
  document.querySelectorAll('.nav a').forEach(function(l){ l.addEventListener('click', function(){ toggleMenu(false); }); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') toggleMenu(false); });
})();
</script>
<script>
/* Ajusta los títulos grandes al ancho disponible para que nunca se corten.
   data-fit="shrink": achica solo si no entra · data-fit="fill": cada línea ocupa todo el ancho */
(function(){
  function fit(){
    document.querySelectorAll('[data-fit]').forEach(function(el){
      var lines = Array.prototype.slice.call(el.querySelectorAll('.fl')), W = el.clientWidth, mode = el.getAttribute('data-fit');
      lines.forEach(function(l){ l.style.fontSize = ''; });
      var sizes = lines.map(function(l){ var base = parseFloat(getComputedStyle(l).fontSize); return base * W / l.offsetWidth; });
      if (mode === 'shrink'){ var base = parseFloat(getComputedStyle(lines[0]).fontSize), s = Math.min.apply(null, sizes.concat([base])); lines.forEach(function(l){ l.style.fontSize = (s * 0.99) + 'px'; }); }
      else if (mode === 'justify'){
        // mismo tamaño para todas las líneas; las más cortas se estiran con espacio entre letras
        var s2 = Math.min.apply(null, sizes) * 0.995;
        lines.forEach(function(l){ l.style.fontSize = s2 + 'px'; l.style.letterSpacing = ''; l.style.marginRight = ''; });
        lines.forEach(function(l){
          var n = l.textContent.trim().length; if (n < 2) return;
          var extra = (W - l.offsetWidth) / (n - 1);
          if (extra > 0.5){ var ls = parseFloat(getComputedStyle(l).letterSpacing) || 0; l.style.letterSpacing = (ls + extra) + 'px'; l.style.marginRight = (-(ls + extra)) + 'px'; }
        });
      }
      else lines.forEach(function(l, i){ l.style.fontSize = (sizes[i] * 0.995) + 'px'; });
    });
  }
  fit(); window.addEventListener('resize', fit); window.addEventListener('load', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
