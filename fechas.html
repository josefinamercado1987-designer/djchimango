<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fechas — DJ Chimango</title>
<meta name="description" content="Próximas fechas de DJ Chimango.">
<meta property="og:title" content="Fechas — DJ Chimango">
<meta property="og:image" content="assets/fechas-bg-desktop.jpg">
<meta name="theme-color" content="#6f93bd">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--ink:#0f2440}
html,body{margin:0;background:#6f93bd;color:var(--ink);font-family:'DM Mono',ui-monospace,monospace}
a{color:var(--ink)}
button{font:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.page{position:relative;min-height:100vh;min-height:100svh;background:#6f93bd url(assets/fechas-bg-desktop.jpg) center/cover no-repeat;padding:128px 64px 56px;display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:clamp(40px,8vw,112px);align-items:start}
.glass{background:rgba(255,255,255,.42);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.75);box-shadow:0 30px 80px rgba(15,36,64,.18)}

/* Header */
.header{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:40px 64px}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;color:#fff}
.nav{display:flex;align-items:center;gap:44px}
.nav-link{position:relative;font-size:14px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:#fff}
.nav-link::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.nav-link:hover::after,.nav-link.active::after{transform:scaleX(1)}
.icons{display:flex;gap:8px;margin-left:4px}
.icon-link{display:flex;align-items:center;justify-content:center;width:44px;height:44px;color:#fff;transition:transform .2s}
.icon-link:hover{transform:translateY(-1px)}
.menu-btn{display:none;width:48px;height:48px;border:0;background:transparent;color:#fff;cursor:pointer;padding:0;align-items:center;justify-content:center}
.menu-btn .i-close{display:none}
.menu-open .menu-btn .i-open{display:none}
.menu-open .menu-btn .i-close{display:block}

/* Columna izquierda */
.side{grid-column:1;grid-row:1 / span 2;display:flex;flex-direction:column;gap:14px;align-self:stretch;padding-top:22px}
.label{font-size:12px;font-weight:500;letter-spacing:.3em;text-transform:uppercase}
.side .label{color:#fff}
.upcoming{border-radius:6px;padding:6px 20px 14px}
.up{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;width:100%;padding:12px 0;border:0;border-top:1px solid rgba(15,36,64,.2);background:transparent;color:var(--ink);text-align:left;cursor:pointer}
.up:first-child{border-top:0}
.up:hover .up-place{text-decoration:underline}
.up.sel .up-date{background:var(--ink);color:#fff}
.up-date{display:flex;flex-direction:column;align-items:center;justify-content:center;height:64px;border:1px solid var(--ink);border-radius:4px}
.up-day{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;line-height:1}
.up-mon{font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.up-place{font-family:'Syne',sans-serif;font-weight:600;font-size:18px}
.up-info{font-size:12px}
.empty{padding:16px 0 4px;font-size:14px;line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:48px;margin-top:12px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.btn:hover{background:#000;color:#fff}
.btn[hidden]{display:none}
.heading{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:40px}
.heading h1{margin:0;font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(72px,8.4vw,120px);line-height:.85;text-transform:uppercase}

/* Calendario */
.cal{grid-column:2;grid-row:1 / span 2;border-radius:8px;padding:28px 28px 20px;display:flex;flex-direction:column;gap:14px;min-height:min(700px,calc(100vh - 184px))}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cal-title{margin:0;min-width:0;white-space:nowrap;display:flex;flex-direction:column-reverse;align-items:flex-start;gap:6px;font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(36px,3.8vw,54px);line-height:1;text-transform:uppercase}
.cal-year{font-family:'DM Mono',monospace;font-weight:500;font-size:13px;letter-spacing:.3em}
.ctrls{display:flex;flex-shrink:0;align-items:center;gap:10px}
.arrow{flex-shrink:0;width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 8px 20px rgba(15,36,64,.25);transition:transform .2s,background .2s}
.arrow:hover{background:#000;transform:scale(1.06)}
.today-btn:hover{background:var(--ink);color:#fff}
.today-btn{flex-shrink:0;height:52px;padding:0 18px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-size:12px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
.dows,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dows{font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:0 10px}
.dows .s{display:none}
.grid{flex:1;grid-auto-rows:minmax(72px,1fr)}
.cell{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:8px 10px;border:0;border-top:1px solid rgba(15,36,64,.14);background:transparent;color:var(--ink);text-align:left;cursor:default;min-width:0}
.cell .num{font-size:15px}
.cell.out{color:rgba(15,36,64,.4)}
.cell.today .num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;margin:-5px 0 0 -7px;border-radius:50%;border:1.5px solid var(--ink)}
.cell.has{cursor:pointer}
.cell.has:hover{background:rgba(255,255,255,.45)}
.cell .ev{max-width:100%;font-size:11px;line-height:1.25;padding:3px 6px;border-radius:3px;background:var(--ink);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .dot{display:none}
.cell.sel{background:rgba(255,255,255,.7)}

/* Mobile */
@media (max-width: 960px){
  .page{display:flex;flex-direction:column;gap:22px;padding:110px 24px 48px;background:#e9d9d6 url(assets/fechas-bg-mobile.jpg) top center/100% auto no-repeat}
  .header{padding:20px 20px 0 24px}
  .logo{font-size:20px}
  .menu-btn{display:flex}
  .nav{position:fixed;inset:0;z-index:-1;flex-direction:column;align-items:flex-start;justify-content:center;gap:28px;padding:0 32px;background:rgba(15,36,64,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .28s ease,visibility .28s}
  .menu-open .nav{opacity:1;visibility:visible}
  .nav-link{font-family:'Syne',sans-serif;font-weight:800;font-size:40px;letter-spacing:.02em}
  .nav-link.active{color:#b9d4f2}
  .nav-link::after{display:none}
  .icons{margin:12px 0 0 -10px}
  .side{display:contents}
  .heading{order:-2;margin:0;padding:0;color:#fff;gap:6px}
  .heading .label{font-size:11px;color:#fff}
  .heading h1{font-size:72px}
  .cal{order:-1;padding:18px 14px 14px;min-height:0;gap:10px}
  .cal-head{flex-wrap:nowrap}
  .cal-title{flex-direction:column;align-items:center;gap:4px;font-size:30px;order:2;flex:1;text-align:center;white-space:normal}
  .cal-year{font-size:12px;letter-spacing:.2em}
  .ctrls{display:contents}
  .today-btn{display:none}
  .arrow{width:46px;height:46px}
  #prev{order:1}#next{order:3}
  .dows{text-align:center;font-size:10px;letter-spacing:.12em;padding:0}
  .dows .l{display:none}.dows .s{display:inline}
  .grid{gap:2px;grid-auto-rows:46px}
  .cell{align-items:center;justify-content:center;gap:3px;padding:0;border:0;border-radius:6px;font-size:14px}
  .cell .ev{display:none}
  .cell .dot{display:block;width:6px;height:6px;border-radius:50%}
  .cell.has .dot{background:var(--ink)}
  .cell.sel{background:var(--ink);color:#fff}
  .cell.sel .dot{background:#fff}
  .cell.today .num{margin:0}
  .cell.sel.today .num{border-color:#fff}
  .side .label{color:var(--ink);font-size:11px}
  .upcoming{padding:4px 18px 14px}
  .up{grid-template-columns:60px minmax(0,1fr)}
  .up-date{height:60px}
  .btn{height:52px}
}
</style>
</head>
<body>
<main class="page">
  <header class="header" id="header">
    <a class="logo" href="index.html">DJ Chimango</a>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav">
      <svg class="i-open" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16"/><path d="M4 16h16"/></svg>
      <svg class="i-close" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
    </button>
    <nav class="nav" id="nav" aria-label="Principal">
      <a class="nav-link" href="musica.html">Música</a>
      <a class="nav-link" href="videos.html">Videos</a>
      <a class="nav-link active" href="fechas.html" aria-current="page">Fechas</a>
      <a class="nav-link" href="chimango.html">Chimango</a>
      <div class="icons">
        <!-- Reemplazar por el link real de Instagram -->
        <a class="icon-link" href="https://instagram.com/" target="_blank" rel="noopener" aria-label="Instagram de DJ Chimango">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r=".9" fill="currentColor" stroke="none"/></svg>
        </a>
        <a class="icon-link" href="https://open.spotify.com/intl-es/artist/6CBacBuu03rdsobTowKmoe" target="_blank" rel="noopener" aria-label="Spotify de DJ Chimango">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M7 9.4c3.4-1 7.2-.7 10.2.9"/><path d="M7.6 12.6c2.8-.8 5.8-.5 8.3.8"/><path d="M8.2 15.6c2.2-.6 4.4-.4 6.4.6"/></svg>
        </a>
      </div>
    </nav>
  </header>

  <aside class="side" aria-label="Próximas fechas">
    <span class="label">Próximas fechas</span>
    <div class="glass upcoming">
      <div id="upList"><p class="empty">Cargando fechas…</p></div>
      <a class="btn" id="ticketBtn" href="#" target="_blank" rel="noopener" hidden>Entradas</a>
    </div>
    <div class="heading">
      <span class="label" style="color:inherit">Agenda · En vivo</span>
      <h1>Fechas</h1>
    </div>
  </aside>

  <section class="glass cal" aria-label="Calendario">
    <div class="cal-head">
      <h2 class="cal-title" aria-live="polite"><span id="calMonth"></span><span class="cal-year" id="calYear"></span></h2>
      <div class="ctrls">
        <button class="today-btn" id="todayBtn" type="button">Hoy</button>
        <button class="arrow" id="prev" type="button" aria-label="Mes anterior"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke-width="2.4"/></svg></button>
        <button class="arrow" id="next" type="button" aria-label="Mes siguiente"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke-width="2.4"/></svg></button>
      </div>
    </div>
    <div class="dows" aria-hidden="true">
      <span><span class="l">Lun</span><span class="s">Lu</span></span><span><span class="l">Mar</span><span class="s">Ma</span></span><span><span class="l">Mié</span><span class="s">Mi</span></span><span><span class="l">Jue</span><span class="s">Ju</span></span><span><span class="l">Vie</span><span class="s">Vi</span></span><span><span class="l">Sáb</span><span class="s">Sá</span></span><span><span class="l">Dom</span><span class="s">Do</span></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<script>
/* ============================================================
   FECHAS — de dónde se leen
   1) Planilla de Google publicada como CSV (lo que edita el DJ).
      Pegá entre las comillas el link de "Publicar en la web" › CSV.
   2) Si queda vacío, se lee el archivo fechas.csv de esta carpeta.
   Columnas: fecha (DD/MM/AAAA) | hora | lugar | ciudad | entradas (link, opcional)
   ============================================================ */
var SHEET_CSV_URL = '';

(function(){
  var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var MES3 = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var today = new Date(); today.setHours(0,0,0,0);
  var state = { y: today.getFullYear(), m: today.getMonth(), sel: null };
  var events = [], byDate = {};

  function key(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function esc(s){ return String(s || '').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function parseCSV(text){
    var rows = [], row = [], f = '', q = false;
    for (var i = 0; i < text.length; i++){
      var c = text[i];
      if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ','){ row.push(f); f = ''; }
      else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f !== '' || row.length){ row.push(f); rows.push(row); }
    return rows;
  }
  function parseDate(s){
    s = (s || '').trim(); var m;
    if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){ var y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[2]-1, +m[1]); }
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return new Date(+m[1], +m[2]-1, +m[3]);
    return null;
  }
  function load(){
    var url = SHEET_CSV_URL || 'fechas.csv';
    return fetch(url, { cache: 'no-store' }).then(function(r){ if (!r.ok) throw 0; return r.text(); })
      .then(function(t){
        var rows = parseCSV(t).filter(function(r){ return r.some(function(c){ return c.trim(); }); });
        var head = rows.shift().map(function(h){ return h.trim().toLowerCase(); });
        var ix = function(n){ return head.indexOf(n); };
        rows.forEach(function(r){
          var d = parseDate(r[ix('fecha')]); if (!d) return;
          events.push({ date: d, key: key(d), time: (r[ix('hora')] || '').trim(), place: (r[ix('lugar')] || '').trim(), city: (r[ix('ciudad')] || '').trim(), tickets: (r[ix('entradas')] || '').trim() });
        });
        events.sort(function(a,b){ return a.date - b.date; });
        events.forEach(function(e){ byDate[e.key] = e; });
      }).catch(function(){});
  }

  var grid = document.getElementById('grid'), upList = document.getElementById('upList'), ticketBtn = document.getElementById('ticketBtn');
  function select(k){ state.sel = k; render(); }
  function render(){
    document.getElementById('calMonth').textContent = MESES[state.m];
    document.getElementById('calYear').textContent = state.y;
    var first = new Date(state.y, state.m, 1), lead = (first.getDay() + 6) % 7, tk = key(today), html = '';
    for (var i = 0; i < 42; i++){
      var d = new Date(state.y, state.m, 1 - lead + i), k = key(d), e = byDate[k], cls = 'cell';
      if (d.getMonth() !== state.m) cls += ' out';
      if (k === tk) cls += ' today';
      if (e) cls += ' has';
      if (e && k === state.sel) cls += ' sel';
      var label = d.getDate() + ' de ' + MESES[d.getMonth()] + (e ? ': ' + e.place + ', ' + e.city : '');
      html += '<button type="button" class="' + cls + '" data-k="' + k + '" aria-label="' + esc(label) + '"' + (e ? '' : ' tabindex="-1"') + '><span class="num">' + d.getDate() + '</span>' + (e ? '<span class="ev">' + esc(e.place) + '</span>' : '') + '<span class="dot" aria-hidden="true"></span></button>';
    }
    grid.innerHTML = html;

    var up = events.filter(function(e){ return e.date >= today; }).slice(0, 4);
    if (!up.length){
      upList.innerHTML = '<p class="empty">Próximamente nuevas fechas.<br>Para contrataciones escribí por Instagram.</p>';
    } else {
      if (!state.sel || !byDate[state.sel]) state.sel = up[0].key;
      upList.innerHTML = up.map(function(e){
        return '<button type="button" class="up' + (e.key === state.sel ? ' sel' : '') + '" data-k="' + e.key + '"><span class="up-date"><span class="up-day">' + String(e.date.getDate()).padStart(2,'0') + '</span><span class="up-mon">' + MES3[e.date.getMonth()] + '</span></span><span style="display:flex;flex-direction:column;gap:3px;min-width:0"><span class="up-place">' + esc(e.place) + '</span><span class="up-info">' + esc(e.city) + (e.time ? ' · ' + esc(e.time) + ' h' : '') + '</span></span></button>';
      }).join('');
    }
    var s = byDate[state.sel];
    if (s && /^https?:\/\//.test(s.tickets)){ ticketBtn.hidden = false; ticketBtn.href = s.tickets; ticketBtn.textContent = 'Entradas · ' + s.place; }
    else ticketBtn.hidden = true;
  }
  grid.addEventListener('click', function(ev){ var b = ev.target.closest('.cell.has'); if (b) select(b.dataset.k); });
  upList.addEventListener('click', function(ev){
    var b = ev.target.closest('.up'); if (!b) return;
    var e = byDate[b.dataset.k]; state.y = e.date.getFullYear(); state.m = e.date.getMonth(); select(e.key);
  });
  document.getElementById('prev').addEventListener('click', function(){ state.m--; if (state.m < 0){ state.m = 11; state.y--; } render(); });
  document.getElementById('next').addEventListener('click', function(){ state.m++; if (state.m > 11){ state.m = 0; state.y++; } render(); });
  document.getElementById('todayBtn').addEventListener('click', function(){ state.y = today.getFullYear(); state.m = today.getMonth(); render(); });

  render();
  load().then(render);

  // Menú mobile
  var header = document.getElementById('header'), mb = document.getElementById('menuBtn');
  function toggleMenu(open){ header.classList.toggle('menu-open', open); mb.setAttribute('aria-expanded', open); mb.setAttribute('aria-label', open ? 'Cerrar menú' : 'Abrir menú'); }
  mb.addEventListener('click', function(){ toggleMenu(!header.classList.contains('menu-open')); });
  document.querySelectorAll('.nav a').forEach(function(l){ l.addEventListener('click', function(){ toggleMenu(false); }); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') toggleMenu(false); });
})();
</script>
</body>
</html>
